name: ios-xctest

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-xctest:
    name: ios-xctest
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COOKLOG_XCTEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
      COOKLOG_XCTEST_TIMEOUT_SECONDS: "600"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Xcode and Simulator contract
        uses: ./.github/actions/prepare-ios-ci
        with:
          artifact-subdirectory: ios-xctest
          destination: ${{ env.COOKLOG_XCTEST_DESTINATION }}

      - name: Inject intentional XCTest failure
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e \
            's/XCTAssertTrue\(true\)/XCTFail("T-20260730-005 intentional failure")/' \
            apps/ios/CookLogTests/CookLogTests.swift
          grep -Fq 'T-20260730-005 intentional failure' \
            apps/ios/CookLogTests/CookLogTests.swift

      - name: Run XCTest
        shell: bash
        run: apps/ios/Scripts/run-xctest.sh

      - name: Summarize CI diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/summarize-ios-ci
        with:
          check-name: ios-xctest
          artifact-subdirectory: ios-xctest
          result: ${{ job.status }}

      - name: Upload XCTest artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cooklog-ios-xctest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-xctest/ci-environment.log
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-xctest/ci-summary.md
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-xctest/*/xcodebuild.log
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-xctest/*/CookLogTests.xcresult
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-xctest/*/TIMED_OUT
          if-no-files-found: warn
          retention-days: 14
