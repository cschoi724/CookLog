name: ios-build

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-ios-changes:
    name: detect-ios-build-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Detect iOS runtime-impacting changes
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "Manual execution always runs the full iOS build."
            exit 0
          fi

          changed_files="${RUNNER_TEMP}/cooklog-changed-files.txt"
          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' \
            > "${changed_files}"

          should_run=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              apps/ios/CookLog/*|\
              apps/ios/CookLogTests/*|\
              apps/ios/CookLog.xcodeproj/*|\
              apps/ios/Scripts/*|\
              apps/ios/*.xcconfig|\
              apps/ios/*.entitlements|\
              .github/actions/*|\
              .github/workflows/ios-*.yml)
                should_run=true
                break
                ;;
            esac
          done < "${changed_files}"

          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "macOS ios-build required: ${should_run}"

  ios-build:
    name: ios-build
    needs: detect-ios-changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.detect-ios-changes.outputs.should_run == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COOKLOG_CI_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
      # T-20260730-006 격리 검증 전용. 이 branch는 병합하지 않는다.
      OTHER_SWIFT_FLAGS: "$(inherited) -cooklog-t006-intentional-build-failure"

    steps:
      - name: Verify trigger decision
        shell: bash
        env:
          DETECTION_RESULT: ${{ needs.detect-ios-changes.result }}
          SHOULD_RUN: ${{ needs.detect-ios-changes.outputs.should_run }}
        run: |
          set -euo pipefail

          if [[ "${DETECTION_RESULT}" != "success" ]]; then
            echo "iOS change detection failed: ${DETECTION_RESULT}" >&2
            exit 1
          fi

          if [[ "${SHOULD_RUN}" != "true" && "${SHOULD_RUN}" != "false" ]]; then
            echo "Invalid iOS change decision: ${SHOULD_RUN}" >&2
            exit 1
          fi

      - name: Skip macOS build for unrelated changes
        if: ${{ needs.detect-ios-changes.outputs.should_run == 'false' }}
        shell: bash
        run: echo "No iOS runtime-impacting paths changed; macOS build is not required."

      - name: Checkout repository
        if: ${{ needs.detect-ios-changes.outputs.should_run == 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Xcode and Simulator contract
        if: ${{ needs.detect-ios-changes.outputs.should_run == 'true' }}
        uses: ./.github/actions/prepare-ios-ci
        with:
          artifact-subdirectory: ios-build
          destination: ${{ env.COOKLOG_CI_DESTINATION }}

      - name: Build app
        if: ${{ needs.detect-ios-changes.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project apps/ios/CookLog.xcodeproj \
            -scheme CookLog \
            -destination "${COOKLOG_CI_DESTINATION}" \
            -derivedDataPath "${COOKLOG_CI_ROOT}/ios-build/DerivedData" \
            build 2>&1 \
            | tee "${COOKLOG_CI_ROOT}/ios-build/xcodebuild-build.log"

      - name: Build tests
        if: ${{ needs.detect-ios-changes.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project apps/ios/CookLog.xcodeproj \
            -scheme CookLog \
            -destination "${COOKLOG_CI_DESTINATION}" \
            -derivedDataPath "${COOKLOG_CI_ROOT}/ios-build/DerivedData" \
            build-for-testing 2>&1 \
            | tee "${COOKLOG_CI_ROOT}/ios-build/xcodebuild-build-for-testing.log"

      - name: Summarize CI diagnostics
        if: ${{ always() && needs.detect-ios-changes.outputs.should_run == 'true' }}
        uses: ./.github/actions/summarize-ios-ci
        with:
          check-name: ios-build
          artifact-subdirectory: ios-build
          result: ${{ job.status }}

      - name: Upload build logs
        if: ${{ always() && needs.detect-ios-changes.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: cooklog-ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-build/ci-environment.log
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-build/ci-summary.md
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-build/xcodebuild-build.log
            ${{ runner.temp }}/cooklog-ci/${{ github.run_id }}-${{ github.run_attempt }}/ios-build/xcodebuild-build-for-testing.log
          if-no-files-found: warn
          retention-days: 14
